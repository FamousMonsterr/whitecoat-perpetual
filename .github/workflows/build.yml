name: Unity Windows + macOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  checks: write      # test-runner публикует чек "Test Results"
  contents: write    # release-job создаёт Release

env:
  # Принудительный переход на Node.js 24 для совместимости с GitHub Actions
  # Документация: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Unity 6000.5.0f1: обход известного бага ShaderGraph 17.4 (CS0246 GUID) из 6000.4 —
  # исправлен только в 6000.5.0a3+. URP/ShaderGraph закреплены на 17.5.0.
  UNITY_VERSION: 6000.5.0f1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-test-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          checkName: Test Results
          coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;generateBadgeReport'

  build:
    name: Build Windows 64
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library and Packages
        uses: actions/cache@v4
        with:
          path: |
            Library
            Packages
          key: Library-win-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-win-${{ runner.os }}-${{ env.UNITY_VERSION }}-
            Library-test-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Build Unity Project (StandaloneWindows64)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: ${{ env.UNITY_VERSION }}
          buildMethod: BuildValidator.ForceBuild
          versioning: Semantic
          allowDirtyBuild: true
          customParameters: -logFile - -buildTarget StandaloneWindows64

      - name: Upload Build Artifact (Windows)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WhitecoatPerpetual_Win64
          path: build/StandaloneWindows64/
          retention-days: 7

      - name: Upload Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: BuildLogs_Win
          path: |
            /github/workspace/Logs/
          retention-days: 3

  build-macos:
    name: Build macOS (Apple Silicon)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library and Packages
        uses: actions/cache@v4
        with:
          path: |
            Library
            Packages
          key: Library-osx-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-osx-${{ runner.os }}-${{ env.UNITY_VERSION }}-
            Library-test-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Build Unity Project (StandaloneOSX)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneOSX
          unityVersion: ${{ env.UNITY_VERSION }}
          buildMethod: BuildValidator.ForceBuild
          versioning: Semantic
          allowDirtyBuild: true
          customParameters: -logFile - -buildTarget StandaloneOSX

      - name: Upload Build Artifact (macOS)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WhitecoatPerpetual_macOS
          path: build/StandaloneOSX/
          retention-days: 7

      - name: Upload Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: BuildLogs_macOS
          path: |
            /github/workspace/Logs/
          retention-days: 3

  release:
    name: Release Windows + macOS
    needs: [ build, build-macos ]
    # Публикуем GitHub Release только когда коммит помечен [release]
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: WhitecoatPerpetual_Win64
          path: build/StandaloneWindows64/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: WhitecoatPerpetual_macOS
          path: build/StandaloneOSX/

      - name: Zip Builds
        run: |
          cd build/StandaloneWindows64
          zip -qr "${{ github.workspace }}/WhitecoatPerpetual_Win64.zip" .
          cd "${{ github.workspace }}/build/StandaloneOSX"
          zip -qry "${{ github.workspace }}/WhitecoatPerpetual_macOS_AppleSilicon.zip" .
          cd "${{ github.workspace }}"
          ls -la *.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.3.0"
          TITLE="Белёк: Вечный Прибой — Windows 64 + macOS (Apple Silicon)"
          gh release view "$TAG" > /dev/null 2>&1 || \
          gh release create "$TAG" --title "$TITLE" --notes "Играбельные сборки (64-bit).

          **Windows:** распакуйте WhitecoatPerpetual_Win64.zip и запустите WhitecoatPerpetual.exe.
          **macOS (Apple Silicon):** распакуйте WhitecoatPerpetual_macOS_AppleSilicon.zip и запустите WhitecoatPerpetual.app.
          Сборка не подписана: первый запуск через правый клик → «Открыть» (или \`xattr -cr WhitecoatPerpetual.app\`).

          Управление: WASD — плавание, Shift — ускорение, Space — всплытие/прыжок,
          Ctrl — нырок, E — взаимодействие.

          Сборка: Unity 6000.5.0f1 (URP 17.5), StandaloneWindows64 + StandaloneOSX (ARM64).
          Коммит: ${{ github.sha }}"
          gh release upload "$TAG" \
            "WhitecoatPerpetual_Win64.zip" \
            "WhitecoatPerpetual_macOS_AppleSilicon.zip" --clobber
          echo "Release ready: https://github.com/${{ github.repository }}/releases/tag/$TAG"
