name: Unity Windows + macOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write      # test-runner публикует чек "Test Results"
  contents: write    # release-job создаёт Release

env:
  # Принудительный переход на Node.js 24 для совместимости с GitHub Actions
  # Документация: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Unity 6000.5.0f1: обход известного бага ShaderGraph 17.4 (CS0246 GUID) из 6000.4 —
  # исправлен только в 6000.5.0a3+. URP/ShaderGraph закреплены на 17.5.0.
  UNITY_VERSION: 6000.5.0f1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-test-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          checkName: Test Results
          coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;generateBadgeReport'

  build:
    name: Build Windows 64
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library and Packages
        uses: actions/cache@v4
        with:
          path: |
            Library
            Packages
          key: Library-win-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-win-${{ runner.os }}-${{ env.UNITY_VERSION }}-
            Library-test-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Build Unity Project (StandaloneWindows64)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: ${{ env.UNITY_VERSION }}
          buildMethod: BuildValidator.ForceBuild
          versioning: Semantic
          allowDirtyBuild: true
          customParameters: -logFile - -buildTarget StandaloneWindows64

      - name: Upload Build Artifact (Windows)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WhitecoatPerpetual_Win64
          path: build/StandaloneWindows64/
          retention-days: 7

      - name: Upload Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: BuildLogs_Win
          path: |
            /github/workspace/Logs/
          retention-days: 3

  build-macos:
    name: Build macOS (Apple Silicon)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library and Packages
        uses: actions/cache@v4
        with:
          path: |
            Library
            Packages
          key: Library-osx-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-osx-${{ runner.os }}-${{ env.UNITY_VERSION }}-
            Library-test-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Build Unity Project (StandaloneOSX)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneOSX
          unityVersion: ${{ env.UNITY_VERSION }}
          buildMethod: BuildValidator.ForceBuild
          versioning: Semantic
          allowDirtyBuild: true
          customParameters: -logFile - -buildTarget StandaloneOSX

      - name: Upload Build Artifact (macOS)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WhitecoatPerpetual_macOS
          path: build/StandaloneOSX/
          retention-days: 7

      - name: Upload Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: BuildLogs_macOS
          path: |
            /github/workspace/Logs/
          retention-days: 3

  smoke-windows:
    name: Smoke Test Windows (real launch)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: WhitecoatPerpetual_Win64
          path: build

      - name: Launch player 100s + screenshot (real D3D11 run)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build\WhitecoatPerpetual.exe" -ArgumentList "-logFile","player.log","-screen-width","1280","-screen-height","720","-screen-fullscreen","0" -PassThru
          Start-Sleep -Seconds 100
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\smoke_win.png")
          $g.Dispose(); $bmp.Dispose()
          Get-Process -Name "WhitecoatPerpetual" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 5
          if (Test-Path "player.log") { Get-Content "player.log" -Tail 80 | Write-Host } else { Write-Host "player.log MISSING" }

      - name: Verify Player.log (smoke gate)
        shell: pwsh
        run: |
          if (-not (Test-Path "player.log")) { Write-Error "player.log missing — player never ran"; exit 1 }
          $log = Get-Content "player.log" -Raw
          $patterns = @("Fatal crash","D3D11: Failed to","Failed to initialize Direct3D","Shader error in","Unhandled Exception","Abort: ")
          $hits = $patterns | Where-Object { $log.Contains($_) }
          if ($hits) { Write-Host "CRITICAL:"; $hits | ForEach-Object { Write-Host " - $_" }; exit 1 }
          if (-not $log.Contains("[Boot]")) { Write-Host "Game never reached boot ([Boot] log absent)"; exit 1 }
          Write-Host "Smoke gate passed: player ran, no fatal/shader errors, boot reached"

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmokeTest_Win
          path: |
            player.log
            smoke_win.png
          retention-days: 7
          if-no-files-found: warn

  smoke-macos:
    name: Smoke Test macOS (real launch, M1 Metal)
    needs: build-macos
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: WhitecoatPerpetual_macOS
          path: build

      - name: Prepare app (Gatekeeper off)
        run: |
          APP="$(find build -maxdepth 3 -name '*.app' -print -quit)"
          echo "APP=$APP" >> "$GITHUB_ENV"
          xattr -cr "$APP"
          chmod +x "$APP/Contents/MacOS/"*

      - name: Launch player 100s + screenshot (real Metal on M1)
        run: |
          # macOS: -logFile требует АБСОЛЮТНЫЙ путь (относительный молча игнорируется)
          "$APP/Contents/MacOS/WhitecoatPerpetual" -logFile "$PWD/player_mac.log" -screen-width 1280 -screen-height 720 -screen-fullscreen 0 &
          sleep 100
          screencapture -x smoke_mac.png || echo "screencapture unavailable"
          pkill -f WhitecoatPerpetual || true
          sleep 4
          if [ ! -f "$PWD/player_mac.log" ]; then
            for f in "$HOME/Library/Logs/WhitecoatPerpetual/Player.log" "$HOME/Library/Logs/DefaultCompany/WhitecoatPerpetual/Player.log" "$HOME/Library/Logs/Unity/Player.log"; do
              if [ -f "$f" ]; then echo "FALLBACK LOG: $f"; cp "$f" "$PWD/player_mac.log"; break; fi
            done
          fi
          tail -60 "$PWD/player_mac.log" 2>/dev/null || echo "player.log MISSING"

      - name: Verify Player.log (smoke gate)
        run: |
          test -f "$PWD/player_mac.log" || { echo "player.log missing — player never ran"; exit 1; }
          if grep -qE "Fatal crash|Shader error in|Metal: Failed to|Failed to create device|Abort:" "$PWD/player_mac.log"; then
            echo "CRITICAL errors found:"; grep -nE "Fatal crash|Shader error in|Metal: Failed to|Failed to create device|Abort:" "$PWD/player_mac.log"; exit 1
          fi
          grep -q "\[Boot\]" "$PWD/player_mac.log" || { echo "Game never reached boot ([Boot] log absent)"; exit 1; }
          echo "Smoke gate passed: player ran, no fatal/shader errors, boot reached"

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmokeTest_macOS
          path: |
            player_mac.log
            smoke_mac.png
          retention-days: 7
          if-no-files-found: warn

  release:
    name: Release Windows + macOS
    needs: [ build, build-macos, smoke-windows, smoke-macos ]
    # Публикуем GitHub Release только когда коммит помечен [release]
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: WhitecoatPerpetual_Win64
          path: build/StandaloneWindows64/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: WhitecoatPerpetual_macOS
          path: build/StandaloneOSX/

      - name: Zip Builds
        run: |
          cd build/StandaloneWindows64
          zip -qr "${{ github.workspace }}/WhitecoatPerpetual_Win64.zip" .
          cd "${{ github.workspace }}/build/StandaloneOSX"
          zip -qry "${{ github.workspace }}/WhitecoatPerpetual_macOS_AppleSilicon.zip" .
          cd "${{ github.workspace }}"
          ls -la *.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v0.3.1"
          TITLE="Белёк: Вечный Прибой — Windows 64 + macOS (Apple Silicon)"
          gh release view "$TAG" > /dev/null 2>&1 || \
          gh release create "$TAG" --title "$TITLE" --notes "Играбельные сборки (64-bit). Реальные смоук-тесты запуска пройдены (windows-latest D3D11 + macos-14 M1 Metal).

          **Windows:** распакуйте WhitecoatPerpetual_Win64.zip и запустите WhitecoatPerpetual.exe.
          **macOS (Apple Silicon):** распакуйте WhitecoatPerpetual_macOS_AppleSilicon.zip и запустите WhitecoatPerpetual.app.
          Сборка не подписана: первый запуск через правый клик → «Открыть» (или \`xattr -cr WhitecoatPerpetual.app\`).

          Управление: WASD — плавание, Shift — ускорение, Space — всплытие/прыжок,
          Ctrl — нырок, E — взаимодействие.

          **v0.3.1 — фикс розового экрана/зависания на старых GPU (Radeon RX Vega 56 и т.п.):**
          - Graphics Jobs отключены (известные зависания драйвера Vega/Polaris при gfx-jobs=1);
          - графический API закреплён: Direct3D11 (Windows) / Metal (macOS);
          - URP-шейдеры добавлены в Always Included Shaders, URP-ассет — во все уровни качества;
          - при первом запуске возможна пауза 30–90 сек (компиляция шейдеров) — это нормально.
          Если экран всё ещё розовый — обновите драйвер AMD Adrenalin и запустите с параметром \`-force-d3d11\`.

          Сборка: Unity 6000.5.0f1 (URP 17.5), StandaloneWindows64 + StandaloneOSX (ARM64).
          Коммит: ${{ github.sha }}" || true
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --generate-notes || true
          gh release upload "$TAG" \
            "WhitecoatPerpetual_Win64.zip" \
            "WhitecoatPerpetual_macOS_AppleSilicon.zip" --clobber
          echo "Release ready: https://github.com/${{ github.repository }}/releases/tag/$TAG"
